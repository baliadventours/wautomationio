services:
  postgres:
    image: postgres:16-alpine
    container_name: wautomation_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wautomation_db}
      POSTGRES_USER: ${POSTGRES_USER:-wautomation_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_this_secure_password_123!}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wautomation_user} -d ${POSTGRES_DB:-wautomation_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - wautomation_net

  redis:
    image: redis:7-alpine
    container_name: wautomation_redis
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-redis_secure_pass_456!}"]
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secure_pass_456!}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - wautomation_net

  evolution_api:
    image: evoapicloud/evolution-api:latest
    container_name: wautomation_evolution_api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      SERVER_URL: ${EVOLUTION_SERVER_URL:-http://localhost:8080}
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-429683C4C977415CAAFCCE10F7D57E11}
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${POSTGRES_USER:-wautomation_user}:${POSTGRES_PASSWORD:-change_this_secure_password_123!}@postgres:5432/${POSTGRES_DB:-wautomation_db}?schema=public
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://:${REDIS_PASSWORD:-redis_secure_pass_456!}@redis:6379/1
    volumes:
      - evolution_instances:/evolution/instances
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - wautomation_net

  wautomation_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wautomation_saas
    restart: always
    depends_on:
      - evolution_api
    environment:
      PORT: 3000
      NODE_ENV: production
      EVOLUTION_API_URL: http://evolution_api:8080
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-429683C4C977415CAAFCCE10F7D57E11}
    ports:
      - "3000:3000"
    networks:
      - wautomation_net

volumes:
  postgres_data:
  redis_data:
  evolution_instances:

networks:
  wautomation_net:
    driver: bridge
